<title>Перевірка меж — Долинське</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ЕКРАН ВИБОРУ ПОЛЯ */
#screenSelect{position:fixed;inset:0;background:#0d1117;z-index:1000;display:flex;flex-direction:column}
#screenSelect h1{padding:20px 16px 8px;font-size:18px;color:#e8d5a3;border-bottom:1px solid #21262d}
#screenSelect p{padding:10px 16px;font-size:13px;color:#8b949e}
#fieldList{flex:1;overflow-y:auto;padding:8px}
.field-item{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.field-item:active{background:#1f2937}
.field-dot{width:14px;height:14px;border-radius:50%;background:#3b82f6;flex-shrink:0}
.field-name{font-size:15px;font-weight:600}
.field-area{font-size:12px;color:#8b949e;margin-top:2px}
.field-pts{font-size:11px;color:#4b5563;margin-top:2px}
.field-done{background:#0d2818!important;border-color:#16a34a!important}
.field-done .field-dot{background:#16a34a}
.field-saved{font-size:11px;color:#4ade80;margin-top:3px}

/* КАРТА */
#map{flex:1}

/* HEADER */
#header{background:#161b22;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #30363d;flex-shrink:0}
#fieldLabel{font-size:14px;font-weight:700;color:#e8d5a3;flex:1}
#btnBack{background:#374151;color:#ccc;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}

/* PROGRESS */
#progress{background:#161b22;padding:6px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #21262d;flex-shrink:0}
#progressBar{flex:1;height:6px;background:#21262d;border-radius:3px;overflow:hidden}
#progressFill{height:100%;background:#16a34a;width:0%;transition:width .4s;border-radius:3px}
#progressText{font-size:12px;color:#8b949e;white-space:nowrap}

/* TOOLBAR */
#toolbar{background:#161b22;padding:8px 10px;display:flex;gap:8px;flex-shrink:0;border-top:1px solid #30363d}
.btn{padding:9px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-gps{background:#2563eb;color:#fff;flex:1}
.btn-gps.on{background:#16a34a}
.btn-export{background:#d97706;color:#fff;flex:1}

/* STATUS */
#status{background:#0d1117;padding:5px 12px;font-size:11px;color:#8b949e;flex-shrink:0;min-height:22px}

/* ALERT OVERLAY */
#alert{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:2000;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background .2s}
#alert.show{background:rgba(22,163,74,.25);pointer-events:none}
#alertBox{background:#14532d;border:2px solid #16a34a;border-radius:16px;padding:24px 32px;text-align:center;transform:scale(0);transition:transform .2s;max-width:280px}
#alert.show #alertBox{transform:scale(1)}
#alertBox .icon{font-size:48px;margin-bottom:8px}
#alertBox .msg{font-size:16px;font-weight:700;color:#bbf7d0}
#alertBox .sub{font-size:13px;color:#86efac;margin-top:4px}

/* ПАНЕЛЬ ФАКТИЧНОЇ ПЛОЩІ */
#areaPanel{background:#14532d;border-top:1px solid #16a34a;padding:6px 12px;font-size:12px;color:#bbf7d0;display:none;flex-shrink:0}
#areaPanel span{font-weight:700;color:#4ade80}
</style>

<!-- ВИБІР ПОЛЯ -->
<div id="screenSelect">
  <h1>🌾 Перевірка меж полів</h1>
  <p>Виберіть поле для обходу:</p>
  <div id="fieldList"></div>
  <div style="padding:10px 8px;border-top:1px solid #21262d">
    <button onclick="exportAllFields()" style="width:100%;background:#374151;color:#e8d5a3;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer">📋 Загальний звіт по всіх полях</button>

</div>

<div id="progress" style="display:none">

<div id="toolbar" style="display:none">

<div id="areaPanel"></div>
<div id="status" style="display:none"></div>

<div id="alert"><div id="alertBox"><div class="icon">✅</div><div class="msg" id="alertMsg"></div><div class="sub" id="alertSub"></div></div></div>

// ===== СТАН =====
let map, currentField = null, gpsActive = false, gpsWatchId = null;
let gpsMarker = null, gpsCircle = null;
let checkpoints = []; // {lat, lng, visited, marker, ringIdx, ptIdx}
let visitLog = []; // {name, lat, lng, time, ringIdx, ptIdx}
const RADIUS_M = 5;

// ===== СПИСОК ПОЛІВ =====
function buildList(){
  const list = document.getElementById('fieldList');
  list.innerHTML='';
  FIELDS_DATA.forEach((f,i)=>{
    const totalPts = f.rings.reduce((s,r)=>s+r.length,0);
    const saved = loadFieldResult(f.name);
    const div = document.createElement('div');
    div.className = 'field-item' + (saved ? ' field-done' : '');
    let savedInfo='';
    if(saved){
      const areaInfo = saved.areaHa ? ` · факт. площа ${saved.areaHa} га` : '';
      savedInfo=`<div class="field-saved">✅ Пройдено ${saved.visitedPts}/${saved.totalPts} точок${areaInfo}<br><small style="color:#6b7280">${saved.savedAt}</small></div>`;
    }
    div.innerHTML =
      `<div class="field-dot"></div>` +
      `<div style="flex:1"><div class="field-name">${f.name}</div><div class="field-area">${f.area} га</div><div class="field-pts">${totalPts} кутових точок</div>${savedInfo}</div>` +
      (saved ? `<button onclick="event.stopPropagation();clearField('${f.name}')" style="background:#374151;color:#9ca3af;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;flex-shrink:0">🗑</button>` : '');
    div.onclick = ()=>selectField(i);
    list.appendChild(div);
  });
}

function clearField(name){
  if(confirm(`Очистити збережені дані поля "${name}"?`)){
    clearFieldResult(name);
    buildList();
  }
}

// ===== ВИБІР ПОЛЯ =====
function selectField(idx){
  currentField = FIELDS_DATA[idx];
  document.getElementById('screenSelect').style.display='none';
  ['header','progress','map','toolbar','status'].forEach(id=>{
    document.getElementById(id).style.display = id==='map' ? 'block' : (id==='toolbar'?'flex':'block');
    if(id==='map') document.getElementById(id).style.flex='1';
  });
  document.getElementById('areaPanel').style.display='none';

  document.getElementById('fieldLabel').textContent = `${currentField.name} · ${currentField.area} га`;
  setStatus('GPS вимкнено — натисніть кнопку для початку');

  // Ініціалізація карти (один раз)
  if(!map){
    map = L.map('map',{zoomControl:true,attributionControl:false});
    L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{
      subdomains:['mt0','mt1','mt2','mt3'],maxZoom:21
    }).addTo(map);
  } else {
    // Очистити попереднє
    map.eachLayer(l=>{ if(!(l instanceof L.TileLayer)) map.removeLayer(l); });
  }

  checkpoints = [];
  visitLog = [];
  manualMarkers = [];
  pendingLatLng = null;
  markerMode = false;
  window._gpsCentered = false;

  // Малюємо контур
  const latlngs = currentField.rings.map(r=>r.map(c=>[c[1],c[0]]));
  const poly = L.polygon(latlngs,{color:'#3b82f6',weight:2.5,fillColor:'#3b82f6',fillOpacity:0.1}).addTo(map);

  // Розставляємо точки на вершинах
  currentField.rings.forEach((ring, ri)=>{
    ring.forEach((coord, pi)=>{
      const lat=coord[1], lng=coord[0];
      const m = L.circleMarker([lat,lng],{
        radius:8, color:'#fff', weight:2,
        fillColor:'#6b7280', fillOpacity:1
      }).addTo(map);
      m.bindPopup(`Кільце ${ri+1}, точка ${pi+1}<br>${lat.toFixed(6)}, ${lng.toFixed(6)}`);
      checkpoints.push({lat,lng,visited:false,marker:m,ringIdx:ri,ptIdx:pi});
    });
  });

  map.fitBounds(poly.getBounds(),{padding:[30,30]});
  updateProgress();
  setTimeout(()=>map.invalidateSize(),300);
  initMapClick();

  // Відновити збережені точки з localStorage
  restoreFieldState();
}

// ===== ПРОГРЕС =====
function updateProgress(){
  const done = checkpoints.filter(c=>c.visited).length;
  const total = checkpoints.length;
  const pct = total ? (done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressText').textContent = `${done} / ${total} точок`;
}

// ===== GPS =====
function toggleGps(){
  gpsActive ? stopGps() : startGps();
}

function startGps(){
  if(!navigator.geolocation){
    setStatus('⚠️ Цей браузер не підтримує GPS');
    return;
  }
  // Перевіряємо дозвіл (тільки якщо API є)
  if(navigator.permissions){
    navigator.permissions.query({name:'geolocation'}).then(r=>{
      if(r.state==='denied'){
        setStatus('⚠️ GPS заблоковано. Відкрий Налаштування → Конфіденційність → Геолокація → дозволь для цього сайту');
        return;
      }
      _doStartGps();
    }).catch(()=>_doStartGps());
  } else {
    _doStartGps();
  }
}

function _doStartGps(){
  setStatus('⏳ Шукаю GPS сигнал...');
  document.getElementById('btnGps').className='btn btn-gps on';
  document.getElementById('btnGps').textContent='🔴 GPS вкл';
  gpsActive = true;
  // Спочатку один разовий запит — дає швидший перший результат на iOS
  navigator.geolocation.getCurrentPosition(
    pos=>{ onGps(pos); },
    err=>{ onGpsErr(err); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );
  // Потім watchPosition для постійного оновлення
  gpsWatchId = navigator.geolocation.watchPosition(onGps, onGpsErr,
    {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

function stopGps(){
  if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
  if(gpsMarker) map.removeLayer(gpsMarker);
  if(gpsCircle) map.removeLayer(gpsCircle);
  gpsMarker=gpsCircle=null; gpsActive=false;
  document.getElementById('btnGps').className='btn btn-gps';
  document.getElementById('btnGps').textContent='📍 Увімкнути GPS';
  setStatus('GPS вимкнено');
}

function onGps(pos){
  if(!map) return;
  const {latitude:lat,longitude:lng,accuracy} = pos.coords;
  if(gpsMarker) map.removeLayer(gpsMarker);
  if(gpsCircle) map.removeLayer(gpsCircle);
  gpsCircle=L.circle([lat,lng],{radius:accuracy,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.08,weight:1}).addTo(map);
  gpsMarker=L.circleMarker([lat,lng],{radius:7,color:'#fff',fillColor:'#2563eb',fillOpacity:1,weight:2}).addTo(map);
  // Перший раз — центруємо карту на себе
  if(!window._gpsCentered){ map.setView([lat,lng],16); window._gpsCentered=true; }
  setStatus(`📍 ±${Math.round(accuracy)}м`);
  checkProximity(lat,lng);
}

function onGpsErr(e){
  const msgs = {1:'Доступ до GPS заборонено — дозволь геолокацію в налаштуваннях браузера',2:'GPS сигнал недоступний',3:'GPS не відповів вчасно — спробуй ще раз'};
  setStatus('⚠️ ' + (msgs[e.code]||e.message));
}

function placeManualMarker(latlng){
  const num=manualMarkers.length+1;

  // Знаходимо найближчу планову точку і рахуємо зміщення
  let nearest=null, nearDist=Infinity;
  checkpoints.forEach(cp=>{
    const d=haversine(latlng.lat,latlng.lng,cp.lat,cp.lng);
    if(d<nearDist){nearDist=d;nearest=cp;}
  });

  // Напрямок зміщення (кардинальний)
  let direction='';
  if(nearest){
    const dLat=latlng.lat-nearest.lat, dLng=latlng.lng-nearest.lng;
    const angle=Math.atan2(dLng,dLat)*180/Math.PI;
    const dirs=['Пн','Пн-Сх','Сх','Пд-Сх','Пд','Пд-Зх','Зх','Пн-Зх'];
    direction=dirs[Math.round((angle+360)%360/45)%8];
  }

  const shiftM=Math.round(nearDist);
  const shiftTxt=nearest ? `${shiftM}м на ${direction} від точки К${nearest.ringIdx+1}.${nearest.ptIdx+1}` : '';

  const icon=L.divIcon({
    className:'',
    html:`<div style="background:#dc2626;color:#fff;border-radius:50% 50% 50% 0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"><span style="transform:rotate(45deg)">${num}</span></div>`,
    iconAnchor:[14,28]
  });

  const markerObj = {num, lat:latlng.lat, lng:latlng.lng, shiftM, shiftTxt, leafletMarker:null};
  manualMarkers.push(markerObj);
  const idx = manualMarkers.length - 1;

  const m = L.marker(latlng,{icon}).addTo(map);
  const popupHtml =
    `<div style="min-width:180px">` +
    `<b>Реальна межа #${num}</b><br>` +
    (shiftTxt?`<span style="color:#dc2626">↔ ${shiftTxt}</span><br>`:'') +
    `<small style="color:#9ca3af">${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}</small><br>` +
    `<button onclick="deleteManualMarker(${idx})" style="margin-top:6px;background:#dc2626;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;width:100%">🗑 Видалити цю точку</button>` +
    `</div>`;
  m.bindPopup(popupHtml).openPopup();
  markerObj.leafletMarker = m;

  setStatus(`📌 Точка #${num}: ${shiftTxt||'зміщення не розраховано'} — натисни на маркер щоб видалити`);
  updateActualArea();
  saveFieldResult();
}

function deleteManualMarker(idx){
  const mo = manualMarkers[idx];
  if(!mo || mo.deleted) return;
  map.removeLayer(mo.leafletMarker);
  mo.deleted = true;
  // Перенумеруємо залишені
  let n=1;
  manualMarkers.forEach(m=>{ if(!m.deleted){ m.num=n++; m.leafletMarker.getPopup().setContent(
    `<div style="min-width:180px"><b>Реальна межа #${m.num}</b><br>`+
    (m.shiftTxt?`<span style="color:#dc2626">↔ ${m.shiftTxt}</span><br>`:'')+
    `<small style="color:#9ca3af">${m.lat.toFixed(6)}, ${m.lng.toFixed(6)}</small><br>`+
    `<button onclick="deleteManualMarker(${manualMarkers.indexOf(m)})" style="margin-top:6px;background:#dc2626;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;width:100%">🗑 Видалити цю точку</button></div>`
  ); }});
  setStatus(`🗑 Точку видалено`);
  updateActualArea();
  saveFieldResult();
}

// Будуємо складений контур: де є маркер землевпорядника — беремо його точку,
// де немає — беремо планову точку. Прив'язка: кожен маркер "належить"
// найближчій плановій точці (що ще не зайнята іншим маркером).
function buildCompositeContour(){
  const active = manualMarkers.filter(m=>!m.deleted);

  // Для кожної планової точки знайти найближчий маркер (в межах 50м)
  // Якщо кілька маркерів претендують на одну точку — перемагає найближчий
  const SNAP_M = 50; // максимальна відстань прив'язки маркера до планової точки
  const assigned = new Map(); // cpIndex -> manualMarker

  active.forEach(mm=>{
    let bestCpIdx=-1, bestDist=Infinity;
    checkpoints.forEach((cp,ci)=>{
      const d=haversine(mm.lat,mm.lng,cp.lat,cp.lng);
      if(d<SNAP_M && d<bestDist){ bestDist=d; bestCpIdx=ci; }
    });
    if(bestCpIdx>=0){
      // Якщо ця планова точка вже зайнята — перемагає той, хто ближче
      if(!assigned.has(bestCpIdx)||bestDist<assigned.get(bestCpIdx).dist){
        assigned.set(bestCpIdx,{mm,dist:bestDist});
      }
    }
  });

  // Будуємо контур по кільцях поля
  const allRingPts = [];
  currentField.rings.forEach((ring,ri)=>{
    ring.forEach((coord,pi)=>{
      const cpIdx = checkpoints.findIndex(c=>c.ringIdx===ri&&c.ptIdx===pi);
      if(cpIdx>=0 && assigned.has(cpIdx)){
        // Є маркер землевпорядника — беремо його координати
        const mm=assigned.get(cpIdx).mm;
        allRingPts.push({lat:mm.lat,lng:mm.lng,source:'surveyor'});
      } else {
        // Немає маркера — беремо планову точку
        allRingPts.push({lat:coord[1],lng:coord[0],source:'planned'});
      }
    });
  });

  return {pts:allRingPts, assignedCount:assigned.size};
}

// Малюємо лінію фактичного контуру і рахуємо площу
function updateActualArea(){
  if(window._actualLayer){ map.removeLayer(window._actualLayer); window._actualLayer=null; }

  const active=manualMarkers.filter(m=>!m.deleted);

  // Показуємо панель як тільки є хоч 1 маркер (решту добудовуємо з планових точок)
  if(active.length<1){ document.getElementById('areaPanel').style.display='none'; return; }

  const {pts, assignedCount} = buildCompositeContour();

  window._actualLayer=L.polygon(pts.map(p=>[p.lat,p.lng]),{
    color:'#dc2626', weight:2, dashArray:'6 4',
    fillColor:'#dc2626', fillOpacity:0.08
  }).addTo(map);

  const areaM2=sphericalArea(pts);
  const areaHa=(areaM2/10000).toFixed(2);
  const planned=currentField.area;
  const diff=(parseFloat(areaHa)-planned).toFixed(2);
  const sign=diff>0?'+':'';
  const totalPts=pts.length;
  const plannedUsed=totalPts-assignedCount;

  const panel=document.getElementById('areaPanel');
  panel.style.display='block';
  panel.innerHTML=
    `📐 Фактична площа: <span>${areaHa} га</span> &nbsp;|&nbsp; ` +
    `Планова: <span>${planned} га</span> &nbsp;|&nbsp; ` +
    `Різниця: <span>${sign}${diff} га</span>` +
    `<br><small style="color:#86efac">Маркерів землевпорядника: ${assignedCount}, планових точок (без маркера): ${plannedUsed}</small>`;
}

// Площа сферичного полігону (формула Гауса на сфері)
function sphericalArea(pts){
  const R=6371000;
  let area=0;
  const n=pts.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const lat1=pts[i].lat*Math.PI/180, lat2=pts[j].lat*Math.PI/180;
    const dLng=(pts[j].lng-pts[i].lng)*Math.PI/180;
    area+=dLng*(2+Math.sin(lat1)+Math.sin(lat2));
  }
  return Math.abs(area*R*R/2);
}

// ===== ПЕРЕВІРКА БЛИЗЬКОСТІ =====
function checkProximity(lat,lng){
  checkpoints.forEach(cp=>{
    if(cp.visited) return;
    const dist = haversine(lat,lng,cp.lat,cp.lng);
    if(dist <= RADIUS_M){
      cp.visited = true;
      // Маркер стає зеленим
      cp.marker.setStyle({fillColor:'#16a34a',color:'#fff'});
      cp.marker.setRadius(10);
      // Запис
      visitLog.push({
        name:`Кільце ${cp.ringIdx+1}, точка ${cp.ptIdx+1}`,
        lat:cp.lat, lng:cp.lng,
        time:new Date().toLocaleTimeString('uk-UA'),
        dist:Math.round(dist),
        ringIdx:cp.ringIdx, ptIdx:cp.ptIdx  // потрібно для відновлення
      });
      updateProgress();
      triggerAlert(cp);
      saveFieldResult();

      const done = checkpoints.filter(c=>c.visited).length;
      if(done === checkpoints.length) fieldComplete();
    }
  });
}

// ===== СИГНАЛ =====
function triggerAlert(cp){
  // Вібрація
  if(navigator.vibrate) navigator.vibrate([200,100,200]);

  // Звук
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((freq,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq; o.type='sine';
      g.gain.setValueAtTime(0.3,ctx.currentTime+i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+0.2);
      o.start(ctx.currentTime+i*0.15);
      o.stop(ctx.currentTime+i*0.15+0.25);
    });
  }catch(e){}

  // Анімація
  const done = checkpoints.filter(c=>c.visited).length;
  const total = checkpoints.length;
  document.getElementById('alertMsg').textContent = `✅ Точка ${done} з ${total}`;
  document.getElementById('alertSub').textContent = `Кільце ${cp.ringIdx+1}, точка ${cp.ptIdx+1}`;
  const al = document.getElementById('alert');
  al.classList.add('show');
  setTimeout(()=>al.classList.remove('show'), 2000);
}

function fieldComplete(){
  if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
  document.getElementById('alertMsg').textContent='🏆 Поле пройдено!';
  document.getElementById('alertSub').textContent=`${currentField.name} — всі ${checkpoints.length} точок перевірено`;
  const al = document.getElementById('alert');
  al.classList.add('show');
  setTimeout(()=>al.classList.remove('show'), 3500);
}

    });

// ===== УТИЛІТИ =====
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ===== LOCALSTORAGE =====
function savedKey(fieldName){ return 'dolynske_field_'+fieldName; }

function saveFieldResult(){
  if(!currentField) return;
  const done=checkpoints.filter(c=>c.visited).length;
  const total=checkpoints.length;
  const activeM=manualMarkers.filter(m=>!m.deleted);

  let areaHa=null;
  if(activeM.length>=1){
    const {pts:cPts}=buildCompositeContour();
    const areaM2=sphericalArea(cPts);
    areaHa=(areaM2/10000).toFixed(2);
  }

  const data={
    fieldName:currentField.name,
    savedAt:new Date().toLocaleString('uk-UA',{timeZone:'Europe/Kiev'}),
    visitedPts:done, totalPts:total,
    areaHa, plannedHa:currentField.area,
    visitLog:visitLog.map(v=>({...v})),
    manualMarkers:activeM.map(m=>({num:m.num,lat:m.lat,lng:m.lng,shiftM:m.shiftM,shiftTxt:m.shiftTxt}))
  };
  try{ localStorage.setItem(savedKey(currentField.name), JSON.stringify(data)); }catch(e){}
}

function loadFieldResult(fieldName){
  try{
    const raw=localStorage.getItem(savedKey(fieldName));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function clearFieldResult(fieldName){
  try{ localStorage.removeItem(savedKey(fieldName)); }catch(e){}
}

// Старт
buildList();
</script>
